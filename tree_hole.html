<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="树洞日记">
  <title>树洞日记</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cream: '#f8f4f0',
            warm: '#e8e0d8',
            text: '#4a4543',
            'text-light': '#8a8583',
            accent: '#e07a5f',
            'accent-light': '#f2a07b',
          }
        }
      }
    }
  </script>

  <!-- js-yaml for YAML parsing -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

    :root {
      --bg-primary: #f8f4f0;
      --bg-secondary: #ede8e3;
      --text-primary: #4a4543;
      --text-secondary: #8a8583;
      --accent: #e07a5f;
      --accent-light: #f2a07b;
      --card-bg: #ffffff;
      --border: #e8e0d8;
    }

    .dark {
      --bg-primary: #1a1a1a;
      --bg-secondary: #2d2d2d;
      --text-primary: #e8e0d8;
      --text-secondary: #8a8583;
      --card-bg: #252525;
      --border: #3d3d3d;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100dvh;
      transition: background-color 0.3s, color 0.3s;
    }

    .font-serif { font-family: 'Noto Serif SC', serif; }

    .view { display: none; opacity: 0; transform: translateY(10px); transition: opacity 0.3s, transform 0.3s; }
    .view.active { display: block; opacity: 1; transform: translateY(0); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:active { transform: scale(0.98); }

    .mood-btn { transition: transform 0.15s, filter 0.15s; }
    .mood-btn:hover { transform: scale(1.15); }
    .mood-btn.selected { transform: scale(1.2); filter: drop-shadow(0 2px 8px rgba(224, 122, 95, 0.4)); }

    .weather-btn { transition: transform 0.15s, background-color 0.15s; }
    .weather-btn:hover { transform: scale(1.05); }
    .weather-btn.selected { background-color: var(--accent); color: white; }

    .btn-primary {
      background: var(--accent);
      color: white;
      transition: transform 0.15s, filter 0.15s;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:active { transform: scale(0.96); }

    .calendar-day.has-entry {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.3s forwards; }
    .slide-up { animation: slideUp 0.3s forwards; }

    .modal-overlay { backdrop-filter: blur(4px); }
    .safe-area-top { padding-top: env(safe-area-inset-top, 0); }
    .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>

  <!-- PWA Manifest -->
  <link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%E6%A0%91%E6%B4%9E%E6%97%A5%E8%AE%B0%22%2C%22short_name%22%3A%22%E6%A0%91%E6%B4%9E%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8f4f0%22%2C%22theme_color%22%3A%22%23e07a5f%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%2520viewBox%3D%270%25200%2520100%2520100%27%253E%253Crect%2520fill%3D%27%2523e07a5f%27%2520width%3D%27100%27%2520height%3D%27100%27%2520rx%3D%2720%27%2F%253E%253Ctext%2520x%3D%2750%27%2520y%3D%2765%27%2520font-size%3D%2750%27%2520text-anchor%3D%27middle%27%253E%25E5%25A4%259C%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
</head>
<body class="flex flex-col min-h-screen">
  <!-- Header -->
  <header class="safe-area-top sticky top-0 z-40 px-4 py-3 border-b border-[var(--border)] bg-[var(--bg-primary)]/95 backdrop-blur-sm">
    <div class="flex items-center justify-between">
      <h1 class="font-serif text-2xl font-semibold tracking-wide">
        <i class="fa-solid fa-moon text-[var(--accent)] mr-2"></i>
        树洞日记
      </h1>
      <div class="flex items-center gap-2">
        <button id="wishBtn" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-[var(--bg-secondary)] transition-colors" title="许愿池">
          <i class="fa-solid fa-star text-[var(--text-secondary)]"></i>
        </button>
        <button id="settingsBtn" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-[var(--bg-secondary)] transition-colors" title="设置">
          <i class="fa-solid fa-gear text-[var(--text-secondary)]"></i>
        </button>
        <button id="themeToggle" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-[var(--bg-secondary)] transition-colors">
          <i class="fa-solid fa-sun text-[var(--text-secondary)] dark:hidden"></i>
          <i class="fa-solid fa-moon text-[var(--text-secondary)] hidden dark:block"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto pb-20">
    <!-- Home View -->
    <div id="homeView" class="view active p-4">
      <!-- View Toggle -->
      <div class="flex justify-center mb-6">
        <div class="bg-[var(--bg-secondary)] p-1 rounded-full inline-flex">
          <button id="viewMyBtn" class="px-6 py-1.5 rounded-full text-sm font-medium bg-[var(--card-bg)] shadow-sm transition-all">我的日记</button>
          <button id="viewFamilyBtn" class="px-6 py-1.5 rounded-full text-sm font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-all">家庭全记录</button>
        </div>
      </div>

      <!-- Today Card -->
      <div id="todayCard" class="mb-6"></div>

      <!-- Calendar -->
      <div class="card rounded-2xl p-4 mb-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-serif text-lg font-semibold">
            <i class="fa-solid fa-calendar-days text-[var(--accent)] mr-2"></i>
            <span id="currentMonth"></span>
          </h2>
          <div class="flex gap-2">
            <button id="prevMonth" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-[var(--bg-secondary)] transition-colors">
              <i class="fa-solid fa-chevron-left text-sm text-[var(--text-secondary)]"></i>
            </button>
            <button id="nextMonth" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-[var(--bg-secondary)] transition-colors">
              <i class="fa-solid fa-chevron-right text-sm text-[var(--text-secondary)]"></i>
            </button>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center mb-2">
          <div class="text-xs text-[var(--text-secondary)]">日</div>
          <div class="text-xs text-[var(--text-secondary)]">一</div>
          <div class="text-xs text-[var(--text-secondary)]">二</div>
          <div class="text-xs text-[var(--text-secondary)]">三</div>
          <div class="text-xs text-[var(--text-secondary)]">四</div>
          <div class="text-xs text-[var(--text-secondary)]">五</div>
          <div class="text-xs text-[var(--text-secondary)]">六</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
      </div>

      <!-- Recent List -->
      <div class="mb-4">
        <h2 class="font-serif text-lg font-semibold mb-3">
          <i class="fa-solid fa-clock-rotate-left text-[var(--accent)] mr-2"></i>
          最近日记
        </h2>
        <div id="recentList" class="space-y-3"></div>
        <div id="emptyRecent" class="hidden text-center py-8 text-[var(--text-secondary)]">
          <i class="fa-solid fa-feather text-4xl mb-3 opacity-50"></i>
          <p>还没有写日记呢</p>
          <p class="text-sm mt-1">从今天开始记录吧</p>
        </div>
      </div>
    </div>

    <!-- Detail View -->
    <div id="detailView" class="view p-4">
      <button id="backToList" class="flex items-center gap-2 text-[var(--text-secondary)] mb-4 hover:text-[var(--accent)] transition-colors">
        <i class="fa-solid fa-arrow-left"></i>
        返回
      </button>
      <div id="detailContent"></div>
    </div>
    <!-- Wish View -->
    <div id="wishView" class="view p-4">
      <div class="flex items-center justify-between mb-6">
        <h2 class="font-serif text-2xl font-semibold">
          <i class="fa-solid fa-star text-yellow-400 mr-2"></i>
          家庭许愿池
        </h2>
        <button id="backFromWish" class="text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors">
          关闭
        </button>
      </div>
      <div id="wishList" class="space-y-4"></div>
      <div id="emptyWish" class="hidden text-center py-12 text-[var(--text-secondary)]">
        <i class="fa-solid fa-seedling text-4xl mb-3 opacity-50"></i>
        <p>许愿池空空的</p>
        <p class="text-sm mt-1">许下第一个愿望吧</p>
      </div>
    </div>
  </main>

  <!-- FAB -->
  <button id="addBtn" class="fixed bottom-6 right-6 w-14 h-14 rounded-full btn-primary shadow-lg flex items-center justify-center z-30">
    <i class="fa-solid fa-plus text-xl"></i>
  </button>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/30 modal-overlay" id="modalOverlay"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-[var(--card-bg)] rounded-t-3xl p-5 safe-area-bottom max-h-[90vh] overflow-y-auto transform translate-y-full transition-transform duration-300" id="modalContent">
      <div id="entryForm">
        <div class="flex items-center justify-between mb-5">
          <h2 class="font-serif text-xl font-semibold" id="formTitle">写日记</h2>
          <button id="closeModal" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-[var(--bg-secondary)]">
            <i class="fa-solid fa-xmark text-lg text-[var(--text-secondary)]"></i>
          </button>
        </div>

        <div class="mb-5 text-center">
          <p class="text-2xl font-serif font-semibold" id="formDate"></p>
        </div>

        <!-- Weather -->
        <div class="mb-5">
          <label class="block text-sm text-[var(--text-secondary)] mb-2">
            <i class="fa-solid fa-cloud-sun mr-1"></i> 今天天气
          </label>
          <div class="flex justify-center gap-3">
            <button class="weather-btn w-12 h-12 rounded-xl flex flex-col items-center justify-center text-sm" data-weather="sunny">
              <i class="fa-solid fa-sun text-xl text-yellow-400"></i>
            </button>
            <button class="weather-btn w-12 h-12 rounded-xl flex flex-col items-center justify-center text-sm" data-weather="cloudy">
              <i class="fa-solid fa-cloud text-xl text-gray-400"></i>
            </button>
            <button class="weather-btn w-12 h-12 rounded-xl flex flex-col items-center justify-center text-sm" data-weather="rainy">
              <i class="fa-solid fa-cloud-rain text-xl text-blue-400"></i>
            </button>
            <button class="weather-btn w-12 h-12 rounded-xl flex flex-col items-center justify-center text-sm" data-weather="snowy">
              <i class="fa-solid fa-snowflake text-xl text-cyan-300"></i>
            </button>
            <button class="weather-btn w-12 h-12 rounded-xl flex flex-col items-center justify-center text-sm" data-weather="foggy">
              <i class="fa-solid fa-smog text-xl text-gray-400"></i>
            </button>
          </div>
        </div>

        <!-- Mood -->
        <div class="mb-5">
          <label class="block text-sm text-[var(--text-secondary)] mb-2">
            <i class="fa-solid fa-heart mr-1"></i> 今日心情
          </label>
          <div class="flex justify-center gap-4">
            <button class="mood-btn text-3xl" data-mood="1">😢</button>
            <button class="mood-btn text-3xl" data-mood="2">😔</button>
            <button class="mood-btn text-3xl" data-mood="3">😐</button>
            <button class="mood-btn text-3xl" data-mood="4">😊</button>
            <button class="mood-btn text-3xl" data-mood="5">🥰</button>
          </div>
        </div>

        <!-- Content -->
        <div class="mb-5">
          <label class="block text-sm text-[var(--text-secondary)] mb-2">
            <i class="fa-solid fa-pen mr-1"></i> 碎碎念
          </label>
          <textarea id="diaryContent" rows="5" placeholder="今天发生了什么..."
            class="w-full p-3 rounded-xl border border-[var(--border)] bg-[var(--bg-secondary)] resize-none focus:outline-none focus:ring-2 focus:ring-[var(--accent)]/30 transition-shadow"></textarea>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
          <button id="deleteEntry" class="hidden flex-1 py-3 rounded-xl border border-red-400 text-red-400 hover:bg-red-50 transition-colors">
            <i class="fa-solid fa-trash-can mr-2"></i>删除
          </button>
          <button id="saveEntry" class="flex-1 py-3 rounded-xl btn-primary">
            <i class="fa-solid fa-check mr-2"></i>保存
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/30 modal-overlay" id="settingsOverlay"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-[var(--card-bg)] rounded-t-3xl p-5 safe-area-bottom max-h-[90vh] overflow-y-auto transform translate-y-full transition-transform duration-300" id="settingsContent">
      <div id="settingsPanel">
        <div class="flex items-center justify-between mb-5">
          <h2 class="font-serif text-xl font-semibold">设置</h2>
          <button id="closeSettings" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-[var(--bg-secondary)]">
            <i class="fa-solid fa-xmark text-lg text-[var(--text-secondary)]"></i>
          </button>
        </div>

        <!-- Storage Mode -->
        <div class="mb-6">
          <label class="block text-sm text-[var(--text-secondary)] mb-3">
            <i class="fa-solid fa-folder-open mr-1"></i> 存储方式
          </label>
          <div class="space-y-2">
            <label class="flex items-center gap-3 p-3 rounded-xl border border-[var(--border)] cursor-pointer hover:bg-[var(--bg-secondary)] transition-colors">
              <input type="radio" name="storageMode" value="localStorage" class="accent-[var(--accent)]">
              <div>
                <p class="font-medium">浏览器存储</p>
                <p class="text-xs text-[var(--text-secondary)]">数据保存在本地浏览器，清除浏览器数据会丢失</p>
              </div>
            </label>
            <label id="fileStorageLabel" class="flex items-center gap-3 p-3 rounded-xl border border-[var(--border)] cursor-pointer hover:bg-[var(--bg-secondary)] transition-colors">
              <input type="radio" name="storageMode" value="fileSystem" class="accent-[var(--accent)]">
              <div>
                <p class="font-medium">文件系统存储</p>
                <p id="fileStorageDesc" class="text-xs text-[var(--text-secondary)]">数据保存在本地 YAML 文件，需要选择保存位置</p>
              </div>
            </label>
          </div>
        </div>

        <!-- File Handle Info -->
        <div id="fileHandleInfo" class="hidden mb-6 p-3 rounded-xl bg-[var(--bg-secondary)]">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-file-lines text-[var(--accent)]"></i>
              <span id="fileNameDisplay" class="text-sm truncate max-w-[200px]">treehole-diaries.yaml</span>
            </div>
            <button id="changeFileBtn" class="text-sm text-[var(--accent)] hover:underline">更换</button>
          </div>
        </div>

        <!-- File System API Warning -->
        <div id="fsApiWarning" class="hidden mb-6 p-3 rounded-xl bg-yellow-50 border border-yellow-200 text-sm">
          <i class="fa-solid fa-triangle-exclamation text-yellow-500 mr-2"></i>
          <span class="text-yellow-700">您的浏览器不支持 File System Access API，请使用 Chrome、Edge 或 Arc 浏览器</span>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
          <button id="importBtn" class="flex-1 py-3 rounded-xl border border-[var(--border)] hover:bg-[var(--bg-secondary)] transition-colors">
            <i class="fa-solid fa-file-import mr-2"></i>导入
          </button>
          <button id="exportBtn" class="flex-1 py-3 rounded-xl border border-[var(--border)] hover:bg-[var(--bg-secondary)] transition-colors">
            <i class="fa-solid fa-file-export mr-2"></i>导出
          </button>
        </div>

        <!-- Import/Export Info -->
        <p class="mt-3 text-xs text-[var(--text-secondary)] text-center">
          <i class="fa-solid fa-info-circle mr-1"></i>
          支持从本地存储导入/导出 YAML 格式数据
        </p>
      </div>
    </div>
  </div>

  <!-- Wish Modal -->
  <div id="wishModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/30 modal-overlay" id="wishModalOverlay"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-[var(--card-bg)] rounded-t-3xl p-5 safe-area-bottom max-h-[90vh] overflow-y-auto transform translate-y-full transition-transform duration-300" id="wishModalContent">
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-serif text-xl font-semibold" id="wishFormTitle">抛硬币许愿</h2>
        <button id="closeWishModal" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-[var(--bg-secondary)]">
          <i class="fa-solid fa-xmark text-lg text-[var(--text-secondary)]"></i>
        </button>
      </div>
      <div class="mb-4">
        <label class="block text-sm text-[var(--text-secondary)] mb-2">愿望标题</label>
        <input type="text" id="wishTitle" placeholder="想要什么功能或心愿..." class="w-full p-3 rounded-xl border border-[var(--border)] bg-[var(--bg-secondary)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]/30 transition-shadow">
      </div>
      <div class="mb-5">
        <label class="block text-sm text-[var(--text-secondary)] mb-2">详情描述</label>
        <textarea id="wishContent" rows="4" placeholder="补充一些细节..." class="w-full p-3 rounded-xl border border-[var(--border)] bg-[var(--bg-secondary)] resize-none focus:outline-none focus:ring-2 focus:ring-[var(--accent)]/30 transition-shadow"></textarea>
      </div>
      <div class="mb-5" id="wishStatusGroup" style="display:none;">
        <label class="block text-sm text-[var(--text-secondary)] mb-2">状态</label>
        <select id="wishStatus" class="w-full p-3 rounded-xl border border-[var(--border)] bg-[var(--bg-secondary)] focus:outline-none">
          <option value="pending">🆕 待实现</option>
          <option value="doing">🚧 建设中</option>
          <option value="completed">✅ 已实现</option>
        </select>
      </div>
      <div class="flex gap-3">
        <button id="deleteWishBtn" class="hidden flex-1 py-3 rounded-xl border border-red-400 text-red-400 hover:bg-red-50 transition-colors">
          <i class="fa-solid fa-trash-can mr-2"></i>删除
        </button>
        <button id="saveWishBtn" class="flex-1 py-3 rounded-xl btn-primary">
          <i class="fa-solid fa-check mr-2"></i>保存
        </button>
      </div>
    </div>
  </div>

  <!-- Identity Modal -->
  <div id="identityModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-sm bg-[var(--card-bg)] rounded-3xl p-6 shadow-2xl">
      <div class="text-center mb-6">
        <i class="fa-solid fa-users text-4xl text-[var(--accent)] mb-4"></i>
        <h2 class="font-serif text-2xl font-semibold mb-2">欢迎来到树洞</h2>
        <p class="text-[var(--text-secondary)] text-sm">请告诉我，你是谁？</p>
      </div>
      <div class="mb-6">
        <input type="text" id="identityInput" placeholder="例如：爸爸、妈妈、宝宝..." class="w-full p-4 rounded-xl border-2 border-[var(--border)] bg-[var(--bg-secondary)] text-center text-lg focus:outline-none focus:border-[var(--accent)] transition-colors">
      </div>
      <button id="saveIdentityBtn" class="w-full py-3.5 rounded-xl btn-primary text-lg font-medium shadow-md">
        进入日记本
      </button>
    </div>
  </div>

  <script>
    // ============ Storage ============
    const STORAGE_KEY = 'treehole_diaries';
    const STORAGE_MODE_KEY = 'treehole_storage_mode';
    const FILE_HANDLE_KEY = 'treehole_file_handle';
    const CURRENT_USER_KEY = 'treehole_current_user';

    function getCurrentUser() {
      return localStorage.getItem(CURRENT_USER_KEY) || 'Me';
    }

    function setCurrentUser(name) {
      localStorage.setItem(CURRENT_USER_KEY, name);
    }

    function migrateV1ToV2(data) {
      if (!data || data.version === 2) {
        if (!data) return { version: 2, diaries: {}, wishes: {} };
        data.diaries = data.diaries || {};
        data.wishes = data.wishes || {};
        return data;
      }
      
      const v2Data = { version: 2, diaries: {}, wishes: {} };
      const author = getCurrentUser();
      
      for (const [key, entry] of Object.entries(data)) {
        if (key === 'version' || key === 'diaries' || key === 'wishes') continue;
        const newId = `${key}_${author}`;
        v2Data.diaries[newId] = {
          ...entry,
          id: newId,
          date: entry.id || key,
          author: author
        };
      }
      return v2Data;
    }

    // File System Storage
    const FileStorage = {
      handle: null,
      isSupported: 'showOpenFilePicker' in window,

      async init() {
        const saved = localStorage.getItem(FILE_HANDLE_KEY);
        if (saved) {
          try {
            const handle = await window.storageManager.getStoredHandle();
            if (handle) {
              this.handle = handle;
              return true;
            }
          } catch {
            localStorage.removeItem(FILE_HANDLE_KEY);
          }
        }
        return false;
      },

      async pickFile() {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'treehole-diaries.yaml',
            types: [{
              description: 'YAML Files',
              accept: { 'text/yaml': ['.yaml', '.yml'] }
            }]
          });
          this.handle = handle;
          localStorage.setItem(FILE_HANDLE_KEY, 'persisted');
          await handle.requestPermission({ mode: 'readwrite' });
          return true;
        } catch (e) {
          if (e.name !== 'AbortError') console.error('File pick failed:', e);
          return false;
        }
      },

      async getAll() {
        if (!this.handle) return { version: 2, diaries: {}, wishes: {} };
        try {
          const file = await this.handle.getFile();
          const text = await file.text();
          let data = jsyaml.load(text) || {};
          if (data.version !== 2) {
            data = migrateV1ToV2(data);
            await this.save(data);
          } else {
            data.diaries = data.diaries || {};
            data.wishes = data.wishes || {};
          }
          return data;
        } catch {
          return { version: 2, diaries: {}, wishes: {} };
        }
      },

      async save(data) {
        if (!this.handle) {
          await this.pickFile();
          if (!this.handle) return false;
        }
        try {
          const writable = await this.handle.createWritable();
          const yaml = jsyaml.dump(data, { allowUnicode: true, flowLevel: -1 });
          await writable.write(yaml);
          await writable.close();
          return true;
        } catch (e) {
          console.error('Save failed:', e);
          return false;
        }
      },

      async getEntry(date, author) {
        const data = await this.getAll();
        const id = `${date}_${author}`;
        return data.diaries[id] || null;
      },

      async saveEntry(date, entry) {
        const data = await this.getAll();
        const author = getCurrentUser();
        const id = `${date}_${author}`;
        data.diaries[id] = {
          ...entry,
          id,
          date,
          author,
          updatedAt: Date.now()
        };
        if (!data.diaries[id].createdAt) {
          data.diaries[id].createdAt = Date.now();
        }
        await this.save(data);
        return data.diaries[id];
      },

      async deleteEntry(date, author) {
        const data = await this.getAll();
        const id = `${date}_${author}`;
        delete data.diaries[id];
        await this.save(data);
      },

      async getEntries() {
        const data = await this.getAll();
        return Object.values(data.diaries).sort((a, b) => b.updatedAt - a.updatedAt);
      },

      async getWish(id) {
        const data = await this.getAll();
        return data.wishes[id] || null;
      },

      async saveWish(wish) {
        const data = await this.getAll();
        const id = wish.id || `wish_${Date.now()}`;
        data.wishes[id] = {

        if (!data.wishes[id].createdAt) {
          data.wishes[id].createdAt = Date.now();
        }
        await this.save(data);
        return data.wishes[id];
      },

      async deleteWish(id) {
        const data = await this.getAll();
        delete data.wishes[id];

      },

      async getWishes() {
        const data = await this.getAll();
        return Object.values(data.wishes).sort((a, b) => b.updatedAt - a.updatedAt);
      }
    };

    // Storage Manager - wraps either FileStorage or LocalStorage
    window.storageManager = {
      currentStorage: null,
      fileHandle: null,

      async init() {
        const mode = localStorage.getItem(STORAGE_MODE_KEY) || 'localStorage';
        this.setMode(mode);
      },

      setMode(mode) {
        this.currentStorage = mode === 'fileSystem' && FileStorage.isSupported ? FileStorage : LocalStorage;
        localStorage.setItem(STORAGE_MODE_KEY, mode);
        if (this.currentStorage === FileStorage && !FileStorage.handle) {
          FileStorage.init();
        }
      },

      getMode() {
        return this.currentStorage === FileStorage ? 'fileSystem' : 'localStorage';
      },

      getAll() {
        return this.currentStorage.getAll();
      },

      save(data) {
        return this.currentStorage.save(data);
      },

      async getEntry(date, author = getCurrentUser()) {
        return await this.currentStorage.getEntry(date, author);
      },

      async saveEntry(date, entry) {
        return await this.currentStorage.saveEntry(date, entry);
      },

      },

      async deleteWish(id) {
        return await this.currentStorage.deleteWish(id);
      },

      async getWishes() {
        return await this.currentStorage.getWishes();
      },

      async getStoredHandle() {
        try {
          const handle = await navigator.storage.getDirectory();
          const dirHandle = await handle.getDirectoryHandle('treehole', { create: true });
          return await dirHandle.getFileHandle('treehole-diaries.yaml', { create: true });
        } catch {
          return null;
        }
      },

      async importData() {
        try {
          const handle = await window.showOpenFilePicker({
            types: [{
              description: 'YAML Files',
              accept: { 'text/yaml': ['.yaml', '.yml'], 'text/plain': ['.txt'] }
            }]
          });
          const file = await handle[0].getFile();
          const text = await file.text();
          let data = jsyaml.load(text);
          if (data && typeof data === 'object') {
            if (data.version !== 2) {
              data = migrateV1ToV2(data);
            }
            this.currentStorage.save(data);
            return true;
          }
        } catch (e) {
          if (e.name !== 'AbortError') console.error('Import failed:', e);
        }
        return false;
      },

      async exportData() {
        try {
          const data = await this.getAll();
          const yaml = jsyaml.dump(data, { allowUnicode: true, flowLevel: -1 });
          const blob = new Blob([yaml], { type: 'text/yaml' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `treehole-diaries-${new Date().toISOString().split('T')[0]}.yaml`;
          a.click();
          URL.revokeObjectURL(url);
          return true;
        } catch (e) {
          console.error('Export failed:', e);
          return false;
        }
      }
    };

    // ============ Calendar ============
    async function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const today = new Date();

      currentMonthEl.textContent = `${year}年${month + 1}月`;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startWeekday = firstDay.getDay();
      const totalDays = lastDay.getDate();

      const entries = await storageManager.getEntries();
      const entriesMap = {};
      entries.forEach(e => {
        if (currentViewMode === 'my' && e.author !== getCurrentUser()) return;
        entriesMap[e.date] = true;
      });

      let html = '';
      for (let i = 0; i < startWeekday; i++) {
        html += '<div class="h-10"></div>';
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasEntry = entriesMap[dateStr];
        const isToday = dateStr === formatDateKey(today);

        html += `
          <div class="calendar-day h-10 rounded-lg flex items-center justify-center text-sm cursor-pointer transition-colors
               ${hasEntry ? 'has-entry' : 'hover:bg-[var(--bg-secondary)]'}
               ${isToday ? 'ring-2 ring-[var(--accent)]' : ''}"
               onclick="onCalendarDayClick('${dateStr}')">
            ${day}
          </div>
        `;
      }

      calendarGrid.innerHTML = html;
    }

    window.onCalendarDayClick = async function(dateStr) {
      if (currentViewMode === 'my') {
        const entry = await storageManager.getEntry(dateStr, getCurrentUser());
        if (entry) {
          showDetail(entry.id);
        } else {
          openNewModal(dateStr);
        }
      } else {
        const entries = await storageManager.getEntries();
        const dayEntries = entries.filter(e => e.date === dateStr);
        if (dayEntries.length > 0) {
          showDetail(dayEntries[0].id);
        }
      }
    }

      const entry = await storageManager.getEntry(dateStr, author);
      if (!entry) return;

      resetForm();
      editingDate = dateStr;
      document.getElementById('formTitle').textContent = '编辑日记';
      document.getElementById('formDate').textContent = dateStr;
      document.getElementById('diaryContent').value = entry.content || '';

      if (entry.weather) {
        const btn = document.querySelector(`.weather-btn[data-weather="${entry.weather}"]`);
        if (btn) btn.classList.add('selected');
      }

      if (entry.mood) {
        const btn = document.querySelector(`.mood-btn[data-mood="${entry.mood}"]`);
        if (btn) btn.classList.add('selected');
      }

      document.getElementById('deleteEntry').classList.remove('hidden');
      openModal();
    };

    document.getElementById('closeModal').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', closeModal);

    document.querySelectorAll('.weather-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    document.querySelectorAll('.mood-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    document.getElementById('saveEntry').addEventListener('click', async () => {
      const selectedWeather = document.querySelector('.weather-btn.selected');
      const selectedMood = document.querySelector('.mood-btn.selected');
      const content = document.getElementById('diaryContent').value.trim();

      const entry = {
        weather: selectedWeather?.dataset.weather || 'sunny',
        mood: parseInt(selectedMood?.dataset.mood) || 3,
        content
      };

      await storageManager.saveEntry(editingDate, entry);
      closeModal();
      renderAll();
      showToast('保存成功');
    });

    document.getElementById('deleteEntry').addEventListener('click', async () => {
      if (confirm('确定要删除这篇日记吗？')) {
        await storageManager.deleteEntry(editingDate, getCurrentUser());
        closeModal();
        showView('home');
        renderAll();
        showToast('已删除');
      }
    });
    
    // Wish Modal logic
    window.openWishModal = async function(wishId = null) {
      editingWishId = wishId;
      document.getElementById('wishTitle').value = '';
      document.getElementById('wishContent').value = '';
      document.getElementById('wishStatus').value = 'pending';
      
      if (wishId) {
        document.getElementById('wishFormTitle').textContent = '编辑愿望';
        const wish = await storageManager.getWish(wishId);
        if (wish) {
           document.getElementById('wishTitle').value = wish.title || '';
           document.getElementById('wishContent').value = wish.description || '';
           document.getElementById('wishStatus').value = wish.status || 'pending';
        }
        document.getElementById('wishStatusGroup').style.display = 'block';
        document.getElementById('deleteWishBtn').classList.remove('hidden');
      } else {
        document.getElementById('wishFormTitle').textContent = '抛硬币许愿';
        document.getElementById('wishStatusGroup').style.display = 'none';
        document.getElementById('deleteWishBtn').classList.add('hidden');
      }
      
      wishModal.classList.remove('hidden');
      requestAnimationFrame(() => {
        wishModalContent.style.transform = 'translateY(0)';
      });
    }
    
    function closeWishModal() {
      wishModalContent.style.transform = 'translateY(100%)';
      setTimeout(() => {
        wishModal.classList.add('hidden');
      }, 300);
    }
    
    document.getElementById('closeWishModal').addEventListener('click', closeWishModal);
    document.getElementById('wishModalOverlay').addEventListener('click', closeWishModal);
    
    document.getElementById('saveWishBtn').addEventListener('click', async () => {
      const title = document.getElementById('wishTitle').value.trim();
      const description = document.getElementById('wishContent').value.trim();
      const status = document.getElementById('wishStatus').value;
      
      if (!title) {
         showToast('标题不能为空');
         return;
      }
      
      const wish = {
         id: editingWishId,
         title,
         description,
         status: editingWishId ? status : 'pending',
         author: editingWishId ? (await storageManager.getWish(editingWishId))?.author || getCurrentUser() : getCurrentUser()
      };
      
      await storageManager.saveWish(wish);
      closeWishModal();
      renderWishes();
      showToast('许愿成功 🌟');
    });
    
    document.getElementById('deleteWishBtn').addEventListener('click', async () => {
      if (confirm('确定要删除这个愿望吗？')) {
        await storageManager.deleteWish(editingWishId);
        closeWishModal();
        renderWishes();
        showToast('已删除');
      }
    });

    // ============ Utilities ============
    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-[var(--accent)] text-white text-sm z-50 fade-in';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, -10px)';
        setTimeout(() => toast.remove(), 300);
      }, 1500);
    }

    // ============ Settings ============
    const settingsModal = document.getElementById('settingsModal');
    const settingsContent = document.getElementById('settingsContent');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettings = document.getElementById('closeSettings');
    const fsApiWarning = document.getElementById('fsApiWarning');
    const fileStorageLabel = document.getElementById('fileStorageLabel');
    const fileStorageDesc = document.getElementById('fileStorageDesc');
    const fileHandleInfo = document.getElementById('fileHandleInfo');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const changeFileBtn = document.getElementById('changeFileBtn');
    const importBtn = document.getElementById('importBtn');
    const exportBtn = document.getElementById('exportBtn');

    function openSettings() {
      settingsModal.classList.remove('hidden');
      requestAnimationFrame(() => {
        settingsContent.style.transform = 'translateY(0)';
      });
      updateSettingsUI();
    }

    function closeSettingsModal() {
      settingsContent.style.transform = 'translateY(100%)';
      setTimeout(() => {
        settingsModal.classList.add('hidden');
      }, 300);
    }

    function updateSettingsUI() {
      const mode = storageManager.getMode();

      // Update radio buttons
      document.querySelectorAll('input[name="storageMode"]').forEach(radio => {
        radio.checked = radio.value === mode;
      });

      // Show/hide API warning
      if (!FileStorage.isSupported) {
        fsApiWarning.classList.remove('hidden');
        fileStorageLabel.classList.add('opacity-50', 'pointer-events-none');
      } else {
        fsApiWarning.classList.add('hidden');
        fileStorageLabel.classList.remove('opacity-50', 'pointer-events-none');
      }

      // Show/hide file handle info
      if (mode === 'fileSystem' && FileStorage.handle) {
        fileHandleInfo.classList.remove('hidden');
        fileNameDisplay.textContent = 'treehole-diaries.yaml';
      } else {
        fileHandleInfo.classList.add('hidden');
      }
    }

    // Settings event listeners
    settingsBtn.addEventListener('click', openSettings);
    closeSettings.addEventListener('click', closeSettingsModal);
    settingsOverlay.addEventListener('click', closeSettingsModal);

    // Storage mode change
    document.querySelectorAll('input[name="storageMode"]').forEach(radio => {
      radio.addEventListener('change', async (e) => {
        const mode = e.target.value;
        if (mode === 'fileSystem' && !FileStorage.handle) {
          const picked = await FileStorage.pickFile();
          if (!picked) {
            updateSettingsUI();
            return;
          }
        }
        storageManager.setMode(mode);
        updateSettingsUI();
        renderAll();
        showToast(mode === 'fileSystem' ? '已切换到文件系统存储' : '已切换到浏览器存储');
      });
    });

    // Change file
    changeFileBtn.addEventListener('click', async () => {
      const picked = await FileStorage.pickFile();
      if (picked) {
        updateSettingsUI();
        showToast('文件已更换');
      }
    });

    // Import
    importBtn.addEventListener('click', async () => {
      const success = await storageManager.importData();
      if (success) {
        renderAll();
        showToast('导入成功');
      }
    });

    // Export
    exportBtn.addEventListener('click', async () => {
      const success = await storageManager.exportData();
      if (success) {
        showToast('导出成功');
      }
    });

    // ============ Init ============
    addBtn.onclick = () => openNewModal(formatDateKey(new Date()));
    
    async function checkIdentity() {
      const user = localStorage.getItem(CURRENT_USER_KEY);
      if (!user) {
        identityModal.classList.remove('hidden');
        document.getElementById('saveIdentityBtn').addEventListener('click', () => {
          const input = document.getElementById('identityInput').value.trim();
          if (input) {
            setCurrentUser(input);
            identityModal.classList.add('hidden');
            renderAll();
          } else {
            showToast('请填写您的身份');
          }
        });
      } else {
        renderAll();
      }
    }

    async function renderAll() {
      await storageManager.init();
      renderTodayCard();
      renderCalendar();
      renderRecentList();
      if (currentView === 'wish') renderWishes();
    }

    checkIdentity();

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'treehole-v1';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', e => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
