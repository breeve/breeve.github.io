<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Every Day</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<style>
:root {
  --bg-primary: #FFF8F0;
  --bg-secondary: #FFF1E6;
  --bg-card: #FFFFFF;
  --color-peach: #FFCBA4;
  --color-lavender: #E6D5F7;
  --color-mint: #B5EAD7;
  --color-sky: #C7CEEA;
  --color-rose: #FFB7B2;
  --color-accent: #FF9A76;
  --color-accent-hover: #FF8A60;
  --color-text: #5D4E37;
  --color-text-light: #8B7D6B;
  --color-border: rgba(93,78,55,0.1);
  --shadow-card: 0 2px 12px rgba(93,78,55,0.08);
  --shadow-hover: 0 6px 24px rgba(93,78,55,0.13);
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-2xl: 48px;
  --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --ease-out: cubic-bezier(0.16,1,0.3,1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-stack);
  background: var(--bg-primary);
  color: var(--color-text);
  line-height: 1.7;
  font-size: clamp(0.875rem, 0.8rem + 0.4vw, 1rem);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,248,240,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--color-border);
  padding: var(--sp-md) var(--sp-lg);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-md);
  flex-wrap: wrap;
}
.app-title {
  font-size: clamp(1.2rem, 1rem + 1vw, 1.6rem);
  font-weight: 700;
  color: var(--color-accent);
  line-height: 1.3;
  white-space: nowrap;
}
.header-nav {
  display: flex;
  gap: var(--sp-xs);
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 3px;
}
.nav-btn {
  border: none;
  background: transparent;
  color: var(--color-text-light);
  font-family: inherit;
  font-size: 0.85rem;
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.25s var(--ease-out);
}
.nav-btn.active {
  background: var(--bg-card);
  color: var(--color-text);
  box-shadow: 0 1px 4px rgba(93,78,55,0.1);
}
.header-actions {
  display: flex;
  gap: var(--sp-sm);
  align-items: center;
}
.action-btn {
  border: none;
  background: var(--bg-secondary);
  color: var(--color-text-light);
  font-family: inherit;
  font-size: 0.8rem;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
}
.action-btn:hover { background: var(--color-peach); color: var(--color-text); }

/* ── Main ── */
.app-main {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--sp-lg);
  padding-bottom: 100px;
}

/* ── Waterfall ── */
.waterfall-container {
  columns: 1;
  column-gap: var(--sp-lg);
}
@media (min-width: 640px) { .waterfall-container { columns: 2; } }
@media (min-width: 1024px) { .waterfall-container { columns: 3; } }

.day-card {
  break-inside: avoid;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: var(--sp-lg);
  margin-bottom: var(--sp-lg);
  cursor: pointer;
  transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out);
  border: 1px solid transparent;
}
.day-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
  border-color: var(--color-border);
}
.card-header {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  margin-bottom: var(--sp-md);
}
.card-feeling { font-size: 1.8rem; line-height: 1; }
.card-date-group { flex: 1; }
.card-date {
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--color-text);
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
}
.card-weather-tag {
  font-size: 0.7rem;
  background: var(--bg-secondary);
  padding: 1px 6px;
  border-radius: 10px;
  color: var(--color-text-light);
  font-weight: 400;
}
.card-relative {
  font-size: 0.75rem;
  color: var(--color-text-light);
}
.card-notes { list-style: none; display: flex; flex-direction: column; gap: var(--sp-sm); }
.note-bubble {
  background: var(--bg-secondary);
  padding: var(--sp-sm) var(--sp-md);
  border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md);
  font-size: 0.9rem;
  line-height: 1.6;
  position: relative;
}
.note-time {
  font-size: 0.7rem;
  color: var(--color-text-light);
  margin-top: 2px;
}

/* ── Calendar ── */
.calendar-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-lg);
  margin-bottom: var(--sp-lg);
}
.cal-arrow {
  border: none;
  background: var(--bg-secondary);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  color: var(--color-text);
}
.cal-arrow:hover { background: var(--color-peach); }
.cal-title {
  font-size: 1.1rem;
  font-weight: 600;
  min-width: 140px;
  text-align: center;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--sp-xs);
  max-width: 560px;
  margin: 0 auto;
}
.cal-weekday {
  text-align: center;
  font-size: 0.75rem;
  color: var(--color-text-light);
  padding: var(--sp-sm) 0;
  font-weight: 600;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
  background: transparent;
  border: 2px solid transparent;
  position: relative;
  gap: 2px;
}
.cal-day:hover { background: var(--bg-secondary); }
.cal-day.today { border-color: var(--color-accent); font-weight: 700; }
.cal-day.has-record { background: var(--bg-secondary); }
.cal-day.empty { cursor: default; }
.cal-day.empty:hover { background: transparent; }
.cal-day .cal-emoji { font-size: 1.1rem; line-height: 1; }
.cal-day .cal-num { font-size: 0.75rem; line-height: 1; }
.cal-day .cal-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--color-accent);
  position: absolute;
  bottom: 4px;
}

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(93,78,55,0.3);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-lg);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s var(--ease-out);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: 0 16px 48px rgba(93,78,55,0.18);
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--sp-xl);
  transform: translateY(20px) scale(0.97);
  transition: transform 0.35s var(--ease-out);
}
.modal-overlay.open .modal-card { transform: translateY(0) scale(1); }
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-lg);
}
.modal-title { font-size: 1.15rem; font-weight: 700; }
.modal-close {
  border: none;
  background: var(--bg-secondary);
  width: 32px; height: 32px;
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-light);
  transition: all 0.2s;
}
.modal-close:hover { background: var(--color-rose); color: var(--color-text); }
.modal-section { margin-bottom: var(--sp-lg); overflow: visible; }
.modal-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--color-text-light);
  margin-bottom: var(--sp-sm);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ── Compact Wheel Picker ── */
.picker-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  overflow: visible;
}
.picker-col {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: auto;
  height: auto;
  transition: width 0.35s var(--ease-out), height 0.35s var(--ease-out), margin 0.35s var(--ease-out);
}
.picker-col.open {
  width: 210px;
  height: 210px;
  margin: 10px 0;
}
.wheel-trigger {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 16px;
  border: 1.5px solid var(--color-border);
  background: var(--bg-secondary);
  color: var(--color-text-light);
  font-family: inherit;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
  user-select: none;
  white-space: nowrap;
  position: relative;
  z-index: 2;
}
.wheel-trigger:hover { background: var(--color-peach); border-color: var(--color-peach); color: var(--color-text); }
.wheel-trigger:active { transform: scale(0.95); }
.picker-col.open .wheel-trigger {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: #fff;
  padding: 6px 10px;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  justify-content: center;
}
.picker-col.open .wheel-trigger span:last-child { display: none; }
.wheel-trigger__emoji { font-size: 1rem; line-height: 1; }
.picker-col.open .wheel-trigger__emoji { font-size: 1.1rem; }
.wheel-item {
  position: absolute;
  left: 50%;
  top: 50%;
  margin-left: -22px;
  margin-top: -24px;
  width: 44px;
  height: 48px;
  border-radius: 14px;
  background: var(--bg-card);
  border: 1.5px solid var(--color-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(93,78,55,0.08);
  opacity: 0;
  transform: scale(0);
  transition: all 0.3s var(--ease-out);
  transition-delay: var(--d, 0ms);
  z-index: 1;
}
.wheel-item__emoji { font-size: 1.05rem; line-height: 1; }
.wheel-item__label { font-size: 0.55rem; color: var(--color-text-light); line-height: 1; white-space: nowrap; }
.picker-col.open .wheel-item {
  opacity: 1;
  transform: scale(1) translate(var(--tx), var(--ty));
}
.wheel-item:hover {
  background: var(--color-peach);
  border-color: var(--color-peach);
  transform: scale(1.2) translate(var(--tx), var(--ty)) !important;
  z-index: 3;
}
.wheel-item:active { transform: scale(0.9) translate(var(--tx), var(--ty)) !important; }
.wheel-item.selected {
  border-color: var(--color-accent);
  background: var(--color-peach);
}
.wheel-item.selected .wheel-item__label { color: var(--color-text); font-weight: 600; }
.wheel-backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.note-input-row {
  display: flex;
  gap: var(--sp-sm);
}
.note-input {
  flex: 1;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--sp-sm) var(--sp-md);
  font-family: inherit;
  font-size: 0.9rem;
  background: var(--bg-primary);
  color: var(--color-text);
  outline: none;
  transition: border-color 0.2s;
}
.note-input:focus { border-color: var(--color-accent); }
.note-input::placeholder { color: var(--color-text-light); opacity: 0.6; }
.note-add-btn {
  border: none;
  background: var(--color-accent);
  color: #fff;
  font-family: inherit;
  font-size: 0.85rem;
  padding: var(--sp-sm) var(--sp-md);
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s;
}
.note-add-btn:hover { background: var(--color-accent-hover); }
.modal-notes-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--sp-sm);
  margin-top: var(--sp-md);
}
.modal-note-item {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-sm);
  background: var(--bg-secondary);
  border-radius: var(--radius-sm);
  padding: var(--sp-sm) var(--sp-md);
}
.modal-note-text { flex: 1; font-size: 0.9rem; word-break: break-word; }
.modal-note-time { font-size: 0.7rem; color: var(--color-text-light); }
.note-delete-btn {
  border: none;
  background: transparent;
  color: var(--color-text-light);
  cursor: pointer;
  font-size: 0.9rem;
  padding: 2px 4px;
  border-radius: 4px;
  transition: all 0.2s;
  flex-shrink: 0;
}
.note-delete-btn:hover { color: #e74c3c; background: rgba(231,76,60,0.1); }
.note-edit-btn {
  border: none;
  background: transparent;
  color: var(--color-text-light);
  cursor: pointer;
  font-size: 0.85rem;
  padding: 2px 4px;
  border-radius: 4px;
  transition: all 0.2s;
  flex-shrink: 0;
}
.note-edit-btn:hover { color: var(--color-accent); background: rgba(255,154,118,0.1); }

/* ── Delete Day ── */
.delete-day-section {
  margin-top: var(--sp-lg);
  padding-top: var(--sp-lg);
  border-top: 1px solid var(--color-border);
  text-align: center;
}
.delete-day-btn {
  border: 1.5px solid var(--color-rose);
  background: transparent;
  color: var(--color-text-light);
  font-family: inherit;
  font-size: 0.8rem;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.delete-day-btn:hover { background: var(--color-rose); color: var(--color-text); }
.delete-confirm-row {
  display: flex;
  gap: var(--sp-sm);
  justify-content: center;
  margin-top: var(--sp-sm);
}
.delete-confirm-row button {
  border: none;
  font-family: inherit;
  font-size: 0.8rem;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-confirm-delete { background: #e74c3c; color: #fff; }
.btn-confirm-delete:hover { background: #c0392b; }
.btn-cancel-delete { background: var(--bg-secondary); color: var(--color-text-light); }
.btn-cancel-delete:hover { background: var(--color-border); }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: var(--sp-xl);
  right: var(--sp-xl);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  background: var(--color-accent);
  color: #fff;
  font-size: 1.6rem;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,154,118,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s var(--ease-out);
  z-index: 50;
}
.fab:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(255,154,118,0.5); }

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: var(--sp-2xl) var(--sp-lg);
  color: var(--color-text-light);
}
.empty-state .empty-icon { font-size: 3rem; margin-bottom: var(--sp-md); }
.empty-state p { font-size: 0.95rem; line-height: 1.8; }

/* ── Import confirm ── */
.import-confirm {
  display: flex;
  gap: var(--sp-sm);
  margin-top: var(--sp-md);
  justify-content: center;
}
.import-confirm button {
  border: none;
  font-family: inherit;
  font-size: 0.85rem;
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-merge { background: var(--color-mint); color: var(--color-text); }
.btn-overwrite { background: var(--color-rose); color: var(--color-text); }
.btn-cancel { background: var(--bg-secondary); color: var(--color-text-light); }

/* ── Hidden file input ── */
#import-file { display: none; }

/* ── View toggle ── */
.view-section { display: none; }
.view-section.active { display: block; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <h1 class="app-title">Happy Every Day</h1>
    <nav class="header-nav">
      <button class="nav-btn active" data-view="waterfall">瀑布流</button>
      <button class="nav-btn" data-view="calendar">日历</button>
    </nav>
    <div class="header-actions">
      <button class="action-btn" id="btn-export">导出</button>
      <button class="action-btn" id="btn-import">导入</button>
      <input type="file" id="import-file" accept=".json">
    </div>
  </div>
</header>

<main class="app-main">
  <section id="waterfall-view" class="view-section active">
    <div class="waterfall-container" id="waterfall"></div>
  </section>
  <section id="calendar-view" class="view-section">
    <div class="calendar-nav">
      <button class="cal-arrow" id="cal-prev">&#8249;</button>
      <span class="cal-title" id="cal-title"></span>
      <button class="cal-arrow" id="cal-next">&#8250;</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </section>
</main>

<button class="fab" id="fab-today" title="记录今天">+</button>

<div class="modal-overlay" id="modal">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-section">
      <div class="picker-row">
        <div class="picker-col" id="feeling-col">
          <button class="wheel-trigger" id="feeling-trigger">
            <span class="wheel-trigger__emoji" id="feeling-emoji">😊</span>
            <span>体感</span>
          </button>
        </div>
        <div class="picker-col" id="weather-col">
          <button class="wheel-trigger" id="weather-trigger">
            <span class="wheel-trigger__emoji" id="weather-emoji">☁️</span>
            <span>天气</span>
          </button>
        </div>
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-label">碎碎念</div>
      <div class="note-input-row">
        <input class="note-input" id="note-input" placeholder="写点什么..." maxlength="500">
        <button class="note-add-btn" id="note-add">添加</button>
      </div>
      <ul class="modal-notes-list" id="modal-notes"></ul>
    </div>
    <div class="delete-day-section" id="delete-day-section">
      <button class="delete-day-btn" id="delete-day-btn">删除此天记录</button>
    </div>
  </div>
</div>

<script>
/* ── Constants ── */
const STORAGE_KEY = 'happy-every-day-data';
const FEELING_TYPES = [
  { key: 'freezing', emoji: '🥶', label: '很冷' },
  { key: 'chilly',   emoji: '🧣', label: '略冷' },
  { key: 'cool',     emoji: '🍃', label: '凉爽' },
  { key: 'comfy',    emoji: '😊', label: '舒适' },
  { key: 'warm',     emoji: '🌤️', label: '温暖' },
  { key: 'humid',    emoji: '💧', label: '湿热' },
  { key: 'hot',      emoji: '🔥', label: '炎热' }
];
const WEATHER_TYPES = [
  { key: 'sunny',         emoji: '☀️', label: '晴' },
  { key: 'partly-cloudy', emoji: '⛅', label: '少云' },
  { key: 'cloudy',        emoji: '☁️', label: '多云' },
  { key: 'overcast',      emoji: '🌫️', label: '阴' },
  { key: 'light-rain',    emoji: '🌦️', label: '小雨' },
  { key: 'heavy-rain',    emoji: '🌊', label: '大雨' },
  { key: 'thunder',       emoji: '⛈️', label: '雷雨' },
  { key: 'snow',          emoji: '🌨️', label: '雪' },
  { key: 'sleet',         emoji: '🧊', label: '雨夹雪' },
  { key: 'wind',          emoji: '🌬️', label: '大风' },
  { key: 'fog',           emoji: '🌁', label: '雾' },
  { key: 'hail',          emoji: '🫧', label: '冰雹' }
];

/* ── Data Layer ── */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.days === 'object') return parsed;
    }
  } catch (_) { /* corrupted data, reset */ }
  return { days: {}, version: 1 };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getDayData(dateStr) {
  const data = loadData();
  return data.days[dateStr] || null;
}

function ensureDay(data, dateStr) {
  if (!data.days[dateStr]) {
    data.days[dateStr] = { feeling: null, weather: null, notes: [] };
  }
  if (data.days[dateStr].feeling === undefined) {
    data.days[dateStr].feeling = null;
  }
  return data;
}

function setFeeling(dateStr, feelingKey) {
  const data = loadData();
  ensureDay(data, dateStr);
  data.days[dateStr].feeling = feelingKey;
  if (!feelingKey && !data.days[dateStr].weather && data.days[dateStr].notes.length === 0) {
    delete data.days[dateStr];
  }
  saveData(data);
}

function setWeather(dateStr, weatherKey) {
  const data = loadData();
  ensureDay(data, dateStr);
  data.days[dateStr].weather = weatherKey;
  if (!weatherKey && !data.days[dateStr].feeling && data.days[dateStr].notes.length === 0) {
    delete data.days[dateStr];
  }
  saveData(data);
}

function addNote(dateStr, text) {
  const data = loadData();
  ensureDay(data, dateStr);
  data.days[dateStr].notes.push({
    id: 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    text: text,
    createdAt: new Date().toISOString()
  });
  saveData(data);
}

function deleteNote(dateStr, noteId) {
  const data = loadData();
  const day = data.days[dateStr];
  if (!day) return;
  data.days[dateStr] = {
    ...day,
    notes: day.notes.filter(n => n.id !== noteId)
  };
  if (!data.days[dateStr].feeling && !data.days[dateStr].weather && data.days[dateStr].notes.length === 0) {
    delete data.days[dateStr];
  }
  saveData(data);
}

function editNote(dateStr, noteId, newText) {
  const data = loadData();
  const day = data.days[dateStr];
  if (!day) return;
  data.days[dateStr] = {
    ...day,
    notes: day.notes.map(n => n.id === noteId ? { ...n, text: newText } : n)
  };
  saveData(data);
}

function deleteDay(dateStr) {
  const data = loadData();
  delete data.days[dateStr];
  saveData(data);
}

function exportData() {
  const data = loadData();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = todayStr();
  a.href = url;
  a.download = `happy-every-day-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported || typeof imported.days !== 'object') {
        alert('文件格式不正确');
        return;
      }
      showImportConfirm(imported);
    } catch (_) {
      alert('文件解析失败');
    }
  };
  reader.readAsText(file);
}

function mergeData(imported) {
  const current = loadData();
  Object.entries(imported.days).forEach(([dateStr, dayData]) => {
    if (!current.days[dateStr]) {
      current.days[dateStr] = dayData;
    } else {
      if (dayData.feeling && !current.days[dateStr].feeling) {
        current.days[dateStr].feeling = dayData.feeling;
      }
      if (dayData.weather && !current.days[dateStr].weather) {
        current.days[dateStr].weather = dayData.weather;
      }
      const existingIds = new Set(current.days[dateStr].notes.map(n => n.id));
      dayData.notes.forEach(note => {
        if (!existingIds.has(note.id)) {
          current.days[dateStr].notes.push(note);
        }
      });
    }
  });
  saveData(current);
}

/* ── Helpers ── */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return `${y}年${m}月${d}日`;
}

function relativeDate(dateStr) {
  const target = new Date(dateStr + 'T00:00:00');
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - target) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff === 2) return '前天';
  if (diff > 0 && diff <= 30) return `${diff}天前`;
  if (diff < 0 && diff >= -1) return '明天';
  return '';
}

function formatTime(isoStr) {
  const d = new Date(isoStr);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function feelingEmoji(key) {
  const f = FEELING_TYPES.find(t => t.key === key);
  return f ? f.emoji : '';
}

function weatherEmoji(key) {
  const w = WEATHER_TYPES.find(t => t.key === key);
  return w ? w.emoji : '';
}

function weatherLabel(key) {
  const w = WEATHER_TYPES.find(t => t.key === key);
  return w ? w.emoji + ' ' + w.label : '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ── Waterfall View ── */
function renderWaterfall() {
  const container = document.getElementById('waterfall');
  const data = loadData();
  const dates = Object.keys(data.days).sort((a, b) => b.localeCompare(a));

  if (dates.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🌱</div>
        <p>还没有任何记录<br>点击右下角开始记录今天吧~</p>
      </div>`;
    return;
  }

  container.innerHTML = dates.map(dateStr => {
    const day = data.days[dateStr];
    const fEmoji = feelingEmoji(day.feeling);
    const wTag = day.weather ? `<span class="card-weather-tag">${weatherLabel(day.weather)}</span>` : '';
    const rel = relativeDate(dateStr);
    const notesHtml = day.notes.map(n =>
      `<li class="note-bubble">
        ${escapeHtml(n.text)}
        <div class="note-time">${formatTime(n.createdAt)}</div>
      </li>`
    ).join('');

    return `<article class="day-card" data-date="${dateStr}">
      <div class="card-header">
        <span class="card-feeling">${fEmoji || '📝'}</span>
        <div class="card-date-group">
          <div class="card-date">${formatDate(dateStr)}${wTag}</div>
          ${rel ? `<div class="card-relative">${rel}</div>` : ''}
        </div>
      </div>
      ${notesHtml ? `<ul class="card-notes">${notesHtml}</ul>` : ''}
    </article>`;
  }).join('');
}

/* ── Calendar View ── */
let calYear, calMonth;

function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('cal-title').textContent = `${calYear}年${calMonth + 1}月`;
  const grid = document.getElementById('calendar-grid');
  const data = loadData();
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const todayD = todayStr();

  let html = weekdays.map(w => `<div class="cal-weekday">${w}</div>`).join('');

  for (let i = 0; i < firstDay; i++) {
    html += '<div class="cal-day empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayData = data.days[dateStr];
    const isToday = dateStr === todayD;
    const hasRecord = !!dayData;
    const emoji = dayData ? feelingEmoji(dayData.feeling) : '';
    const hasNotes = dayData && dayData.notes.length > 0;

    const classes = ['cal-day'];
    if (isToday) classes.push('today');
    if (hasRecord) classes.push('has-record');

    html += `<div class="${classes.join(' ')}" data-date="${dateStr}">
      ${emoji ? `<span class="cal-emoji">${emoji}</span>` : ''}
      <span class="cal-num">${d}</span>
      ${hasNotes ? '<span class="cal-dot"></span>' : ''}
    </div>`;
  }

  grid.innerHTML = html;
}

/* ── Modal ── */
let currentEditDate = null;

function openEditor(dateStr) {
  currentEditDate = dateStr;
  const modal = document.getElementById('modal');
  document.getElementById('modal-title').textContent = formatDate(dateStr);

  const dayData = getDayData(dateStr);
  renderFeelingGrid(dayData ? dayData.feeling : null);
  renderWeatherGrid(dayData ? dayData.weather : null);
  renderModalNotes(dateStr);
  document.getElementById('note-input').value = '';

  const addBtn = document.getElementById('note-add');
  delete addBtn.dataset.editingId;
  addBtn.textContent = '添加';

  resetDeleteSection();

  modal.classList.add('open');
  setTimeout(() => document.getElementById('note-input').focus(), 350);
}

function closeEditor() {
  document.getElementById('modal').classList.remove('open');
  currentEditDate = null;
  renderWaterfall();
  renderCalendar();
}

/* ── Wheel helpers ── */
function closeAllWheels() {
  document.getElementById('feeling-col').classList.remove('open');
  document.getElementById('weather-col').classList.remove('open');
  removeWheelBackdrop();
}

function addWheelBackdrop() {
  removeWheelBackdrop();
  const bd = document.createElement('div');
  bd.className = 'wheel-backdrop';
  bd.id = 'wheel-backdrop';
  bd.addEventListener('click', closeAllWheels);
  document.body.appendChild(bd);
}

function removeWheelBackdrop() {
  const bd = document.getElementById('wheel-backdrop');
  if (bd) bd.remove();
}

function renderFeelingGrid(selectedKey) {
  const col = document.getElementById('feeling-col');
  const emojiEl = document.getElementById('feeling-emoji');
  const sel = FEELING_TYPES.find(f => f.key === selectedKey);
  emojiEl.textContent = sel ? sel.emoji : '😊';

  col.querySelectorAll('.wheel-item').forEach(el => el.remove());
  const radius = 78;
  const count = FEELING_TYPES.length;
  const step = 360 / count;
  FEELING_TYPES.forEach((f, i) => {
    const angle = (-90 + step * i) * Math.PI / 180;
    const tx = Math.cos(angle) * radius;
    const ty = Math.sin(angle) * radius;
    const div = document.createElement('div');
    div.className = 'wheel-item' + (f.key === selectedKey ? ' selected' : '');
    div.dataset.feeling = f.key;
    div.style.setProperty('--tx', tx + 'px');
    div.style.setProperty('--ty', ty + 'px');
    div.style.setProperty('--d', (i * 25) + 'ms');
    div.innerHTML = `<span class="wheel-item__emoji">${f.emoji}</span><span class="wheel-item__label">${f.label}</span>`;
    col.appendChild(div);
  });
}

function renderWeatherGrid(selectedKey) {
  const col = document.getElementById('weather-col');
  const emojiEl = document.getElementById('weather-emoji');
  const sel = WEATHER_TYPES.find(w => w.key === selectedKey);
  emojiEl.textContent = sel ? sel.emoji : '☁️';

  col.querySelectorAll('.wheel-item').forEach(el => el.remove());
  const radius = 82;
  const count = WEATHER_TYPES.length;
  const step = 360 / count;
  WEATHER_TYPES.forEach((w, i) => {
    const angle = (-90 + step * i) * Math.PI / 180;
    const tx = Math.cos(angle) * radius;
    const ty = Math.sin(angle) * radius;
    const div = document.createElement('div');
    div.className = 'wheel-item' + (w.key === selectedKey ? ' selected' : '');
    div.dataset.weather = w.key;
    div.style.setProperty('--tx', tx + 'px');
    div.style.setProperty('--ty', ty + 'px');
    div.style.setProperty('--d', (i * 20) + 'ms');
    div.innerHTML = `<span class="wheel-item__emoji">${w.emoji}</span><span class="wheel-item__label">${w.label}</span>`;
    col.appendChild(div);
  });
}

function renderModalNotes(dateStr) {
  const list = document.getElementById('modal-notes');
  const dayData = getDayData(dateStr);
  if (!dayData || dayData.notes.length === 0) {
    list.innerHTML = '';
    return;
  }
  list.innerHTML = dayData.notes
    .slice()
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
    .map(n =>
      `<li class="modal-note-item">
        <div>
          <div class="modal-note-text">${escapeHtml(n.text)}</div>
          <div class="modal-note-time">${formatTime(n.createdAt)}</div>
        </div>
        <button class="note-edit-btn" data-note-id="${n.id}" data-note-text="${escapeHtml(n.text)}" title="编辑">✎</button>
        <button class="note-delete-btn" data-note-id="${n.id}" title="删除">&times;</button>
      </li>`
    ).join('');
}

/* ── Import Confirm ── */
function showImportConfirm(imported) {
  const count = Object.keys(imported.days).length;
  const modal = document.getElementById('modal');
  const card = modal.querySelector('.modal-card');

  card.innerHTML = `
    <div class="modal-header">
      <span class="modal-title">导入数据</span>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-section" style="text-align:center;">
      <p>检测到 <strong>${count}</strong> 天的记录</p>
      <div class="import-confirm">
        <button class="btn-merge" id="import-merge">合并</button>
        <button class="btn-overwrite" id="import-overwrite">覆盖</button>
        <button class="btn-cancel" id="import-cancel">取消</button>
      </div>
    </div>`;

  modal.classList.add('open');

  document.getElementById('import-merge').onclick = () => {
    mergeData(imported);
    closeImportModal();
  };
  document.getElementById('import-overwrite').onclick = () => {
    saveData(imported);
    closeImportModal();
  };
  document.getElementById('import-cancel').onclick = closeImportModal;
  document.getElementById('modal-close').onclick = closeImportModal;
}

function closeImportModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('open');
  restoreModalContent();
  renderWaterfall();
  renderCalendar();
}

function restoreModalContent() {
  const card = document.querySelector('.modal-card');
  card.innerHTML = `
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-section">
      <div class="picker-row">
        <div class="picker-col" id="feeling-col">
          <button class="wheel-trigger" id="feeling-trigger">
            <span class="wheel-trigger__emoji" id="feeling-emoji">😊</span>
            <span>体感</span>
          </button>
        </div>
        <div class="picker-col" id="weather-col">
          <button class="wheel-trigger" id="weather-trigger">
            <span class="wheel-trigger__emoji" id="weather-emoji">☁️</span>
            <span>天气</span>
          </button>
        </div>
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-label">碎碎念</div>
      <div class="note-input-row">
        <input class="note-input" id="note-input" placeholder="写点什么..." maxlength="500">
        <button class="note-add-btn" id="note-add">添加</button>
      </div>
      <ul class="modal-notes-list" id="modal-notes"></ul>
    </div>
    <div class="delete-day-section" id="delete-day-section">
      <button class="delete-day-btn" id="delete-day-btn">删除此天记录</button>
    </div>`;
  bindModalEvents();
}

/* ── Event Binding ── */
function bindViewSwitch() {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const view = btn.dataset.view;
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.getElementById(`${view}-view`).classList.add('active');
    });
  });
}

function bindWaterfallClicks() {
  document.getElementById('waterfall').addEventListener('click', (e) => {
    const card = e.target.closest('.day-card');
    if (card) openEditor(card.dataset.date);
  });
}

function bindCalendarClicks() {
  document.getElementById('calendar-grid').addEventListener('click', (e) => {
    const day = e.target.closest('.cal-day:not(.empty)');
    if (day) openEditor(day.dataset.date);
  });
  document.getElementById('cal-prev').addEventListener('click', () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });
}

function bindModalEvents() {
  document.getElementById('modal-close').addEventListener('click', closeEditor);

  // Wheel Picker: Feeling
  document.getElementById('feeling-trigger').addEventListener('click', () => {
    const col = document.getElementById('feeling-col');
    const otherCol = document.getElementById('weather-col');
    const opening = !col.classList.contains('open');
    col.classList.toggle('open');
    otherCol.classList.remove('open');
    if (opening) addWheelBackdrop();
    else removeWheelBackdrop();
  });
  document.getElementById('feeling-col').addEventListener('click', (e) => {
    const item = e.target.closest('.wheel-item');
    if (item && currentEditDate) {
      const key = item.dataset.feeling;
      const dayData = getDayData(currentEditDate);
      const current = dayData ? dayData.feeling : null;
      const newVal = (current === key) ? null : key;
      setFeeling(currentEditDate, newVal);
      renderFeelingGrid(newVal);
      closeAllWheels();
    }
  });

  // Wheel Picker: Weather
  document.getElementById('weather-trigger').addEventListener('click', () => {
    const col = document.getElementById('weather-col');
    const otherCol = document.getElementById('feeling-col');
    const opening = !col.classList.contains('open');
    col.classList.toggle('open');
    otherCol.classList.remove('open');
    if (opening) addWheelBackdrop();
    else removeWheelBackdrop();
  });
  document.getElementById('weather-col').addEventListener('click', (e) => {
    const item = e.target.closest('.wheel-item');
    if (item && currentEditDate) {
      const key = item.dataset.weather;
      const dayData = getDayData(currentEditDate);
      const current = dayData ? dayData.weather : null;
      const newVal = (current === key) ? null : key;
      setWeather(currentEditDate, newVal);
      renderWeatherGrid(newVal);
      closeAllWheels();
    }
  });

  document.getElementById('note-add').addEventListener('click', () => {
    const input = document.getElementById('note-input');
    const addBtn = document.getElementById('note-add');
    const text = input.value.trim();
    if (!text || !currentEditDate) return;

    if (addBtn.dataset.editingId) {
      editNote(currentEditDate, addBtn.dataset.editingId, text);
      delete addBtn.dataset.editingId;
      addBtn.textContent = '添加';
    } else {
      addNote(currentEditDate, text);
    }
    input.value = '';
    renderModalNotes(currentEditDate);
    input.focus();
  });

  document.getElementById('note-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      document.getElementById('note-add').click();
    }
  });

  document.getElementById('modal-notes').addEventListener('click', (e) => {
    const deleteBtn = e.target.closest('.note-delete-btn');
    if (deleteBtn && currentEditDate) {
      deleteNote(currentEditDate, deleteBtn.dataset.noteId);
      renderModalNotes(currentEditDate);
      return;
    }
    const editBtn = e.target.closest('.note-edit-btn');
    if (editBtn && currentEditDate) {
      const noteId = editBtn.dataset.noteId;
      const noteText = editBtn.dataset.noteText;
      const input = document.getElementById('note-input');
      const addBtn = document.getElementById('note-add');
      input.value = noteText;
      input.focus();
      addBtn.textContent = '保存';
      addBtn.dataset.editingId = noteId;
    }
  });

  document.getElementById('delete-day-section').addEventListener('click', (e) => {
    if (e.target.closest('#delete-day-btn')) {
      showDeleteConfirm();
      return;
    }
    if (e.target.closest('#confirm-delete-day')) {
      if (currentEditDate) {
        deleteDay(currentEditDate);
        closeEditor();
      }
      return;
    }
    if (e.target.closest('#cancel-delete-day')) {
      resetDeleteSection();
    }
  });
}

function resetDeleteSection() {
  const section = document.getElementById('delete-day-section');
  section.innerHTML = '<button class="delete-day-btn" id="delete-day-btn">删除此天记录</button>';
}

function showDeleteConfirm() {
  const section = document.getElementById('delete-day-section');
  section.innerHTML = `
    <span style="font-size:0.8rem;color:var(--color-text-light);">确定删除此天所有记录？</span>
    <div class="delete-confirm-row">
      <button class="btn-confirm-delete" id="confirm-delete-day">确定删除</button>
      <button class="btn-cancel-delete" id="cancel-delete-day">取消</button>
    </div>`;
}

function bindModalOverlay() {
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) {
      if (currentEditDate) closeEditor();
      else closeImportModal();
    }
  });
}

function bindFab() {
  document.getElementById('fab-today').addEventListener('click', () => {
    openEditor(todayStr());
  });
}

function bindExportImport() {
  document.getElementById('btn-export').addEventListener('click', exportData);
  document.getElementById('btn-import').addEventListener('click', () => {
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      importData(file);
      e.target.value = '';
    }
  });
}

/* ── Init ── */
function init() {
  bindViewSwitch();
  bindWaterfallClicks();
  bindCalendarClicks();
  bindModalEvents();
  bindModalOverlay();
  bindFab();
  bindExportImport();
  renderWaterfall();
  initCalendar();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
