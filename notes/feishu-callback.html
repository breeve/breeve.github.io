<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>飞书授权回调</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fa;
      }
      .card {
        max-width: 22rem;
        margin: 1.5rem;
        padding: 2rem;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .icon {
        font-size: 2.4rem;
        line-height: 1;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0.6rem 0 0.3rem;
      }
      p {
        margin: 0.3rem 0;
        font-size: 0.9rem;
        color: #555;
        line-height: 1.6;
      }
      .ok {
        color: #1a7f37;
      }
      .err {
        color: #cf222e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" id="icon">⏳</div>
      <h1 id="title">正在处理授权…</h1>
      <p id="detail">即将返回 Notes Editor</p>
    </div>
    <script>
      // 飞书 OAuth 回调页（静态，与主应用同源）。
      // 流程：读 code+state → 校验 state → POST Worker 换 token → 存 localStorage
      // → postMessage 通知 opener → 页面展示结果。

      (function () {
        var params = new URLSearchParams(location.search);
        var code = params.get('code');
        var state = params.get('state');
        var expected = null;
        try {
          expected = sessionStorage.getItem('notes-editor:feishu-state');
        } catch (e) {}
        var proxy = null;
        try {
          proxy = localStorage.getItem('notes-editor:feishu-proxy');
        } catch (e) {}

        // 与授权时一致的 redirect_uri（= 本页地址，去掉查询串）。
        var redirectUri = location.origin + location.pathname;

        function done(ok, error) {
          try {
            sessionStorage.removeItem('notes-editor:feishu-state');
          } catch (e) {}
          var icon = document.getElementById('icon');
          var title = document.getElementById('title');
          var detail = document.getElementById('detail');
          if (ok) {
            icon.textContent = '✅';
            title.textContent = '授权完成';
            detail.textContent = '请回到 Notes Editor 页面，即可导入飞书文档。';
          } else {
            icon.textContent = '❌';
            title.textContent = '授权失败';
            detail.textContent = error || '未知错误';
            detail.className = 'err';
          }
          if (window.opener) {
            try {
              window.opener.postMessage(
                { type: 'feishu-auth-done', ok: ok, error: error || '' },
                location.origin,
              );
            } catch (e) {}
          }
        }

        function fail(error) {
          done(false, error);
        }

        if (params.get('error')) {
          fail('飞书授权被拒绝（' + params.get('error') + '）');
          return;
        }
        if (!code) {
          fail('未收到授权码，请回到 Notes Editor 重新授权。');
          return;
        }
        if (!expected || !state || state !== expected) {
          fail('state 校验失败，可能是链接过期，请回到 Notes Editor 重新授权。');
          return;
        }
        if (!proxy) {
          fail('缺少中转服务地址，请回到 Notes Editor 重新授权。');
          return;
        }

        fetch(proxy.replace(/\/+$/, '') + '/feishu/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code, redirectUri: redirectUri }),
        })
          .then(function (resp) {
            return resp.json().catch(function () {
              throw new Error('中转服务响应异常');
            });
          })
          .then(function (data) {
            if (!data.ok) throw new Error(data.error || '换 token 失败');
            if (!data.accessToken) throw new Error('未取得 access_token');
            var token = {
              accessToken: data.accessToken,
              refreshToken: data.refreshToken || '',
              expiresAt: Date.now() + Number(data.expiresIn || 7200) * 1000,
            };
            localStorage.setItem('notes-editor:feishu-token', JSON.stringify(token));
            done(true);
          })
          .catch(function (err) {
            fail(err.message || '网络错误');
          });
      })();
    </script>
  </body>
</html>
