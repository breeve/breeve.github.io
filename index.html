<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小七的奇思妙想 | flynn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1f2328;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #d0d7de;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .avatar:hover {
            transform: scale(1.08);
        }

        .article-item {
            border-bottom: 1px solid #f0f0f0;
            padding: 1rem 0;
            transition: all 0.2s ease;
        }
        .article-item:last-child {
            border-bottom: none;
        }
        .article-link {
            color: #0969da;
            text-decoration: none;
            font-size: 1.125rem;
            font-weight: 500;
        }
        .article-link:hover {
            color: #054da5;
            text-decoration: underline;
        }
        .article-date {
            font-size: 0.85rem;
            color: #636c76;
            margin-bottom: 0.2rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        footer {
            margin-top: 5rem;
            border-top: 1px solid #eee;
            padding-top: 2rem;
            font-size: 0.85rem;
            color: #8c959f;
            text-align: center;
        }
    </style>

</head>
<body class="antialiased">

    <div class="container">
        <header class="flex flex-col items-center text-center mb-16">
            <img src="xiaoqi.jpg" alt="头像" class="avatar mb-6">
            <h1 class="text-3xl font-bold mb-3 tracking-tight">flynn</h1>
            <p class="text-gray-600 max-w-md text-base">
                hello every one.
            </p>
            <div class="flex gap-5 mt-6 text-sm">
                <a href="https://github.com" target="_blank" class="text-gray-400 hover:text-black transition-colors">GitHub</a>
            </div>
        </header>

        <section>
            <h2 class="text-xl font-semibold mb-6 text-gray-900 border-b pb-2">精选文章</h2>
            <div id="article-list-container"></div>
        </section>

        <script src="https://giscus.app/client.js"
                data-repo="breeve/breeve.github.io"
                data-repo-id="R_kgDOQW4isg"
                data-category="Announcements"
                data-category-id="DIC_kwDOQW4iss4C526d"
                data-mapping="title"
                data-strict="1"
                data-reactions-enabled="1"
                data-emit-metadata="1"
                data-input-position="top"
                data-theme="preferred_color_scheme"
                data-lang="zh-CN"
                data-loading="lazy"
                crossorigin="anonymous"
                async>
        </script>
        <footer>
            <p>© 2026 flynn. 保持好奇，持续输出。</p>
        </footer>
    </div>

    <script>
        const ARTICLE_DATA = [
            {
                date: "2026-04-02",
                title: "NFV l3 switch 的一个简单实现",
                url: "https://github.com/breeve/nfvcni"
            },
            {
                date: "2026-05-17",
                title: "hello",
                url: "hello.html"
            }
        ];

        function renderArticles() {
            const container = document.getElementById('article-list-container');

            const htmlContent = ARTICLE_DATA.map(item => `
                <div class="article-item">
                    <div class="article-date">${item.date}</div>
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="article-link">
                        ${item.title}
                    </a>
                </div>
            `).join('');

            container.innerHTML = htmlContent;
        }

        window.addEventListener('DOMContentLoaded', renderArticles);
    </script>

</body>
</html>
